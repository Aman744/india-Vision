<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <!-- Left: rounded square border -->
  <rect x="10" y="10" width="128" height="128" rx="10" ry="10"
        fill="none" stroke="#1B4FAF" stroke-width="6"/>

  <!-- Star polygon (5-point) centered in the square -->
  <polygon
    points="74,28 83,57 114,57 90,74 99,103 74,86 49,103 58,74 34,57 65,57"
    fill="none" stroke="#1B4FAF" stroke-width="5" stroke-linejoin="round"/>

  <!-- Diagonal arrow line through star (top-right to bottom-left) -->
  <line x1="97" y1="42" x2="52" y2="100"
        stroke="#1B4FAF" stroke-width="5" stroke-linecap="round"/>

  <!-- Arrowhead at bottom -->
  <polyline points="44,92 52,104 64,97"
            fill="none" stroke="#1B4FAF" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider line -->
  <line x1="152" y1="22" x2="152" y2="128"
        stroke="#1B4FAF" stroke-width="3" opacity="0.35"/>

  <!-- BLUE STAR text -->
  <text
    x="172" y="98"
    font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
    font-size="60"
    font-weight="900"
    fill="#1B4FAF"
    letter-spacing="1">BLUE STAR</text>
</svg>
