<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded corner background block -->
  <rect width="512" height="512" rx="128" fill="#05080F"/>
  
  <!-- Outer glowing ring in Sky Cyan -->
  <rect x="32" y="32" width="448" height="448" rx="96" 
        stroke="#0EA5E9" stroke-width="16" stroke-opacity="0.25"/>
  
  <!-- Inner ring showing electronic signals -->
  <rect x="64" y="64" width="384" height="384" rx="80" 
        stroke="#1D4ED8" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Stylized Smart TV / Electronic Screen border -->
  <rect x="112" y="112" width="288" height="224" rx="24" 
        fill="#0C1220" stroke="#0EA5E9" stroke-width="16"/>
        
  <!-- TV Stand -->
  <path d="M216 336 L200 400 L312 400 L296 336 Z" 
        fill="#1D4ED8" stroke="#0EA5E9" stroke-width="8" stroke-linejoin="round"/>
        
  <!-- Glowing Monogram "V" (for Vision) inside the screen as a lightning/energy signal -->
  <path d="M192 176 L256 304 L320 176" 
        stroke="#0EA5E9" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "I" (for India) glowing dot above the screen / antenna sign -->
  <circle cx="256" cy="80" r="16" fill="#F59E0B"/>
</svg>